server.port=8080

spring.application.name=field-notes-backend

# MySQL Configuration (supports environment variables or defaults to local port 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:field_notes}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${UPLOAD_DIR:uploads}

# JWT Security
app.jwt.secret=${JWT_SECRET:9a3f8c2e6d1b4a705e83c2a1b9d4e7f60123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=86400000

